version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_PATH=/app/data/bank_card_system.db
      - PORT=5000
    volumes:
      - kami-data:/app/data
      - kami-logs:/app/logs
    restart: unless-stopped

volumes:
  kami-data:
    driver: local
  kami-logs:
    driver: local
