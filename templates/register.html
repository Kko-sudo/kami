<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 阿肖网络</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        #floating-messages-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10000;
            overflow: hidden;
        }

        .floating-message {
            position: fixed;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            color: white;
            pointer-events: none;
            z-index: 10001;
            opacity: 0;
            animation: floatLeft 20s linear forwards;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }

        @keyframes floatLeft {
            0% {
                opacity: 0;
                transform: translateX(100vw) translateY(0);
            }
            10% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            95% {
                opacity: 0;
            }
            100% {
                opacity: 0;
                transform: translateX(-100vw) translateY(0);
            }
        }

        .floating-message:nth-child(odd) {
            animation-delay: 0s;
        }

        .floating-message:nth-child(even) {
            animation-delay: 3s;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .meteor {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px white;
            animation: meteor 3s linear infinite;
            opacity: 0;
        }

        @keyframes meteor {
            0% {
                transform: rotate(215deg) translateX(0);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: rotate(215deg) translateX(-1000px);
                opacity: 0;
            }
        }

        .main-container {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
            padding: 40px 20px;
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo {
            font-size: 72px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 8px;
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(118, 75, 162, 0.8));
            }
        }

        .subtitle {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 50px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1s ease-out;
            width: 100%;
            max-width: 450px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .register-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .register-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            font-size: 15px;
            color: white;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.6);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .switch-auth {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.7);
        }

        .switch-auth a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .switch-auth a:hover {
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .message {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }

        .message.success {
            background: rgba(67, 233, 123, 0.2);
            color: #43e97b;
            border: 1px solid rgba(67, 233, 123, 0.3);
        }

        .message.error {
            background: rgba(254, 107, 139, 0.2);
            color: #fe6b8b;
            border: 1px solid rgba(254, 107, 139, 0.3);
        }

        .hidden {
            display: none !important;
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .site-footer {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            padding: 30px 20px 20px;
            width: 100%;
            position: relative;
            z-index: 10;
            margin-top: auto;
        }

        .footer-content {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto 20px;
        }

        .footer-section {
            flex: 1;
            min-width: 250px;
            text-align: center;
        }

        .footer-section p {
            font-size: 13px;
            line-height: 2;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 5px;
        }

        .footer-bottom {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .footer-bottom p {
            font-size: 12px;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.6);
        }

        .footer-legal {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 10px;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 48px;
                letter-spacing: 4px;
            }

            .subtitle {
                font-size: 18px;
                letter-spacing: 2px;
            }

            .register-card {
                padding: 35px 25px;
                margin: 0 15px;
            }

            .register-header h1 {
                font-size: 28px;
            }

            .form-group input {
                padding: 12px 15px;
            }

            .btn {
                padding: 15px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="floating-messages-container"></div>
    <div class="stars" id="stars"></div>
    
    <div class="main-container">
        <div class="logo-container">
            <div class="logo">阿肖网络</div>
            <div class="subtitle">专业的银行自动化解决方案</div>
        </div>
        
        <div class="register-card">
            <div class="register-header">
                <h1>创建账户</h1>
                <p>加入我们，开启您的银行自动化之旅</p>
            </div>

            <div id="message-container"></div>

            <div id="register-form">
                <form id="registerForm">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="register-username" required placeholder="请输入用户名" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>密码（至少6位）</label>
                        <input type="password" id="register-password" required minlength="6" placeholder="请输入密码" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label>邮箱（可选）</label>
                        <input type="email" id="register-email" placeholder="请输入邮箱" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label>手机号（可选）</label>
                        <input type="tel" id="register-phone" placeholder="请输入手机号" autocomplete="tel">
                    </div>
                    <button type="submit" class="btn btn-primary">注册</button>
                    <button type="button" class="btn btn-secondary" onclick="showLogin()">已有账号？登录</button>
                </form>
            </div>

            <div id="login-form" class="hidden">
                <form id="loginForm">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="login-username" required placeholder="请输入用户名" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="login-password" required placeholder="请输入密码" autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary">登录</button>
                    <button type="button" class="btn btn-secondary" onclick="showRegister()">没有账号？注册</button>
                </form>
            </div>

            <div class="back-link">
                <a href="javascript:window.history.back()">← 返回上一级</a>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-section">
                <p>技术支持微信：X-PRPS</p>
                <p>客服邮箱：2231036058@qq.com</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 阿肖网络 版权所有</p>
            <p class="footer-legal">
                本网站受法律保护，抄袭必究
            </p>
        </div>
    </footer>

    <script>
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }

            for (let i = 0; i < 5; i++) {
                const meteor = document.createElement('div');
                meteor.className = 'meteor';
                meteor.style.left = Math.random() * 100 + '%';
                meteor.style.top = Math.random() * 50 + '%';
                meteor.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(meteor);
            }
        }

        function startFloatingMessages() {
            const messages = [
                { text: '阿肖网络欢迎您！', color: 'linear-gradient(135deg, rgba(102, 126, 234, 0.9) 0%, rgba(118, 75, 162, 0.9) 100%)' },
                { text: '马年马到成功！', color: 'linear-gradient(135deg, rgba(240, 147, 251, 0.9) 0%, rgba(245, 87, 108, 0.9) 100%)' },
                { text: '祝您事业蒸蒸日上！', color: 'linear-gradient(135deg, rgba(79, 172, 254, 0.9) 0%, rgba(0, 242, 254, 0.9) 100%)' },
                { text: '感谢您的信任与支持！', color: 'linear-gradient(135deg, rgba(67, 233, 123, 0.9) 0%, rgba(56, 249, 215, 0.9) 100%)' },
                { text: '技术支持微信：X-PRPS', color: 'linear-gradient(135deg, rgba(250, 112, 154, 0.9) 0%, rgba(254, 225, 64, 0.9) 100%)' },
                { text: '优质服务，用心为您！', color: 'linear-gradient(135deg, rgba(168, 237, 234, 0.9) 0%, rgba(254, 214, 227, 0.9) 100%)' },
                { text: '祝您财源滚滚！', color: 'linear-gradient(135deg, rgba(255, 154, 158, 0.9) 0%, rgba(254, 207, 239, 0.9) 100%)' },
                { text: '阿肖网络，值得信赖！', color: 'linear-gradient(135deg, rgba(102, 126, 234, 0.9) 0%, rgba(118, 75, 162, 0.9) 100%)' }
            ];

            const container = document.getElementById('floating-messages-container');
            let messageIndex = 0;

            function createFloatingMessage() {
                const message = messages[messageIndex % messages.length];
                const messageElement = document.createElement('div');
                messageElement.className = 'floating-message';
                messageElement.textContent = message.text;
                messageElement.style.background = message.color;
                messageElement.style.top = Math.random() * 80 + 10 + '%';
                
                container.appendChild(messageElement);
                
                messageIndex++;
                
                setTimeout(() => {
                    messageElement.remove();
                }, 20000);
            }

            for (let i = 0; i < 3; i++) {
                setTimeout(createFloatingMessage, i * 2000);
            }
            
            setInterval(createFloatingMessage, 4000);
        }

        const API_BASE = '/api';

        function showMessage(message, type = 'success') {
            const container = document.getElementById('message-container');
            container.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        function showLogin() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('register-form').classList.add('hidden');
        }

        function showRegister() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
        }

        async function register(username, password, email, phone) {
            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email, phone })
                });
                const data = await response.json();
                
                if (data.success) {
                    showMessage('注册成功，请登录');
                    showLogin();
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('注册失败，请稍后重试', 'error');
            }
        }

        async function login(username, password) {
            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, login_type: 'user' })
                });
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showMessage('登录成功');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('登录失败，请稍后重试', 'error');
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;
            const email = document.getElementById('register-email').value;
            const phone = document.getElementById('register-phone').value;
            await register(username, password, email, phone);
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            await login(username, password);
        });

        createStars();
        startFloatingMessages();
    </script>
</body>
</html>
