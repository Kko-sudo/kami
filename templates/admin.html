<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿肖网络 - 管理后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .meteor-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .meteor {
            position: absolute;
            width: 2px;
            height: 80px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.8));
            animation: meteor 3s linear infinite;
            opacity: 0;
        }

        @keyframes meteor {
            0% {
                transform: translateY(-100px) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) translateX(300px);
                opacity: 0;
            }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
            padding: 40px 20px;
            max-width: 1400px;
            width: 100%;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 8px;
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(118, 75, 162, 0.8));
            }
        }

        .header p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
            letter-spacing: 2px;
        }

        .main-content {
            width: 100%;
            color: white;
        }

        .auth-container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .auth-container h2 {
            color: white;
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: white;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            color: white;
            backdrop-filter: blur(10px);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.8);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.8), rgba(118, 75, 162, 0.8));
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 1), rgba(118, 75, 162, 1));
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn-danger {
            background: rgba(231, 76, 60, 0.8);
            color: white;
            width: auto;
            padding: 8px 20px;
            font-size: 14px;
        }

        .btn-danger:hover {
            background: rgba(231, 76, 60, 1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .hidden {
            display: none !important;
        }

        .message {
            padding: 15px 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .message.success {
            background: rgba(212, 237, 218, 0.3);
            color: #d4edda;
            border: 1px solid rgba(212, 237, 218, 0.5);
        }

        .message.error {
            background: rgba(248, 215, 218, 0.3);
            color: #f8d7da;
            border: 1px solid rgba(248, 215, 218, 0.5);
        }

        .admin-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .admin-nav button {
            flex: 1;
            min-width: 150px;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
            color: white;
        }

        .admin-nav button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .admin-nav button.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.8), rgba(118, 75, 162, 0.8));
            color: white;
            border-color: rgba(102, 126, 234, 0.8);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .admin-section {
            display: none;
        }

        .admin-section.active {
            display: block;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .section-header h2 {
            color: white;
            font-size: 28px;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 16px;
            opacity: 0.9;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-table thead {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            color: white;
        }

        .data-table th, .data-table td {
            padding: 18px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-table th {
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .data-table td {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }

        .data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .status-badge.pending {
            background: rgba(255, 243, 205, 0.3);
            color: #fff3cd;
            border: 1px solid rgba(255, 243, 205, 0.5);
        }

        .status-badge.awaiting {
            background: rgba(255, 243, 205, 0.3);
            color: #fff3cd;
            border: 2px solid rgba(255, 193, 7, 0.8);
        }

        .status-badge.paid {
            background: rgba(204, 229, 255, 0.3);
            color: #cce5ff;
            border: 1px solid rgba(204, 229, 255, 0.5);
        }

        .status-badge.completed {
            background: rgba(212, 237, 218, 0.3);
            color: #d4edda;
            border: 1px solid rgba(212, 237, 218, 0.5);
        }

        .status-badge.used {
            background: rgba(248, 215, 218, 0.3);
            color: #f8d7da;
            border: 1px solid rgba(248, 215, 218, 0.5);
        }

        .status-badge.available {
            background: rgba(209, 236, 241, 0.3);
            color: #d1ecf1;
            border: 1px solid rgba(209, 236, 241, 0.5);
        }

        .card-key-display {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin-top: 5px;
        }

        .generate-form {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .generate-form h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .user-info h2 {
            color: #333;
            font-size: 20px;
        }

        .user-info button {
            padding: 8px 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .user-info button:hover {
            background: #c0392b;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .table-responsive {
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>阿肖网络 - 管理后台</h1>
            <p>系统管理和卡密生成</p>
        </div>

        <div class="main-content">
            <div id="message-container"></div>

            <div id="login-form" class="auth-container">
                <h2 style="text-align: center; margin-bottom: 30px; color: #333;">管理员登录</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="login-username" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">登录</button>
                </form>
            </div>

            <div id="dashboard" class="hidden">
                <div class="user-info">
                    <h2>欢迎，<span id="username-display"></span></h2>
                    <button onclick="logout()">退出登录</button>
                </div>

                <div class="admin-nav">
                    <button class="active" onclick="showSection('orders')">订单管理</button>
                    <button onclick="showSection('prices')">价格管理</button>
                    <button onclick="showSection('account')">账号管理</button>
                </div>

                <div id="section-orders" class="admin-section active">
                    <div class="section-header">
                        <h2>订单管理</h2>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>用户</th>
                                    <th>银行</th>
                                    <th>卡密类型</th>
                                    <th>有效期</th>
                                    <th>卡密</th>
                                    <th>价格</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="orders-table">
                                <tr><td colspan="10" class="loading">加载中</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="section-prices" class="admin-section">
                    <div class="section-header">
                        <h2>价格管理</h2>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>卡密类型</th>
                                    <th>价格（元）</th>
                                    <th>有效期（天）</th>
                                    <th>描述</th>
                                    <th>更新时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="prices-table">
                                <tr><td colspan="6" class="loading">加载中</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="section-account" class="admin-section">
                    <div class="section-header">
                        <h2>账号管理</h2>
                    </div>
                    <div class="form-container">
                        <form id="update-admin-form" onsubmit="updateAdminCredentials(event)">
                            <div class="form-group">
                                <label for="new-username">新用户名</label>
                                <input type="text" id="new-username" required placeholder="请输入新用户名">
                            </div>
                            <div class="form-group">
                                <label for="new-password">新密码</label>
                                <input type="password" id="new-password" required placeholder="请输入新密码">
                            </div>
                            <button type="submit" class="submit-btn">更新账号密码</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        function showMessage(message, type = 'success') {
            const container = document.getElementById('message-container');
            container.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        async function login(username, password) {
            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, login_type: 'admin' })
                });
                const data = await response.json();
                
                if (data.success) {
                    if (!data.user.is_admin) {
                        showMessage('需要管理员权限', 'error');
                        return;
                    }
                    localStorage.setItem('admin', JSON.stringify(data.user));
                    document.getElementById('username-display').textContent = data.user.username;
                    showMessage('登录成功');
                    document.getElementById('login-form').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    loadOrders();
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('登录失败，请稍后重试', 'error');
            }
        }

        async function logout() {
            try {
                await fetch(`${API_BASE}/logout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login_type: 'admin' })
                });
            } catch (error) {
                console.error('Logout error:', error);
            }
            localStorage.removeItem('admin');
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            showMessage('已退出登录');
        }

        async function loadOrders() {
            try {
                const response = await fetch(`${API_BASE}/admin/orders`);
                const data = await response.json();
                
                const tbody = document.getElementById('orders-table');
                
                if (data.success && data.orders.length > 0) {
                    tbody.innerHTML = data.orders.map(order => {
                        let statusText = '';
                        let statusClass = '';
                        let actions = '';
                        
                        switch(order.status) {
                            case 'pending':
                                statusText = '待支付';
                                statusClass = 'pending';
                                actions = `
                                    <button onclick="confirmPayment(${order.id})" class="btn-primary" style="padding: 5px 10px; font-size: 12px; margin: 2px; background: #28a745;">确认支付</button>
                                    <button onclick="generateCardKey(${order.id})" class="btn-primary" style="padding: 5px 10px; font-size: 12px; margin: 2px;">生成卡密</button>
                                `;
                                break;
                            case 'awaiting_confirmation':
                                statusText = '待确认';
                                statusClass = 'awaiting';
                                actions = `
                                    <button onclick="confirmPayment(${order.id})" class="btn-primary" style="padding: 5px 10px; font-size: 12px; margin: 2px; background: #ffc107; color: #000;">确认支付</button>
                                    <button onclick="rejectPayment(${order.id})" class="btn-primary" style="padding: 5px 10px; font-size: 12px; margin: 2px; background: #dc3545;">拒绝支付</button>
                                `;
                                break;
                            case 'paid':
                                statusText = '已支付';
                                statusClass = 'paid';
                                actions = `
                                    <button onclick="generateCardKey(${order.id})" class="btn-primary" style="padding: 5px 10px; font-size: 12px; margin: 2px;">生成卡密</button>
                                    <button onclick="sendCardKey(${order.id})" class="btn-primary" style="padding: 5px 10px; font-size: 12px; margin: 2px;" ${!order.card_key ? 'disabled' : ''}>发送卡密</button>
                                `;
                                break;
                            case 'completed':
                                statusText = '已完成';
                                statusClass = 'completed';
                                actions = `<span style="color: #28a745; font-size: 12px;">已完成</span>`;
                                break;
                            case 'cancelled':
                                statusText = '已取消';
                                statusClass = 'used';
                                actions = `<span style="color: #999; font-size: 12px;">已取消</span>`;
                                break;
                            default:
                                statusText = order.status;
                                statusClass = order.status;
                                actions = '-';
                        }
                        
                        return `
                        <tr>
                            <td>${order.id}</td>
                            <td>${order.username || '未知用户'}</td>
                            <td>${order.bank_name || '未知银行'}</td>
                            <td>${order.card_type || '标准'}</td>
                            <td>${order.days_valid || 0}天</td>
                            <td>${order.card_key || '-'}</td>
                            <td>¥${(order.price || 0).toFixed(2)}</td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                            <td>${new Date(order.created_at).toLocaleString()}</td>
                            <td>${actions}</td>
                        </tr>
                    `}).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="10" class="empty-state"><h3>暂无订单</h3></td></tr>';
                }
            } catch (error) {
                console.error('加载订单失败:', error);
                tbody.innerHTML = '<tr><td colspan="10" class="empty-state"><h3>加载失败</h3></td></tr>';
            }
        }

        async function confirmPayment(orderId) {
            if (!confirm('确认该订单已支付？确认后将生成卡密并发送给用户。')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/admin/orders/${orderId}/confirm-payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    loadOrders();
                } else {
                    showMessage(data.message || '确认支付失败', 'error');
                }
            } catch (error) {
                showMessage('确认支付失败：' + error.message, 'error');
            }
        }

        async function rejectPayment(orderId) {
            if (!confirm('确认拒绝该订单的支付？订单将被标记为已取消。')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/admin/orders/${orderId}/cancel`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                
                if (data.success) {
                    showMessage('已拒绝支付', 'success');
                    loadOrders();
                } else {
                    showMessage(data.message || '操作失败', 'error');
                }
            } catch (error) {
                showMessage('操作失败：' + error.message, 'error');
            }
        }

        async function generateCardKey(orderId) {
            try {
                const response = await fetch(`${API_BASE}/admin/order/generate-card-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: orderId })
                });
                const data = await response.json();
                
                if (data.success) {
                    showMessage('卡密生成成功', 'success');
                    loadOrders();
                } else {
                    showMessage(data.message || '生成卡密失败', 'error');
                }
            } catch (error) {
                showMessage('生成卡密失败：' + error.message, 'error');
            }
        }

        async function sendCardKey(orderId) {
            try {
                const response = await fetch(`${API_BASE}/admin/order/send-card-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: orderId })
                });
                const data = await response.json();
                
                if (data.success) {
                    showMessage('卡密发送成功', 'success');
                    loadOrders();
                } else {
                    showMessage(data.message || '发送卡密失败', 'error');
                }
            } catch (error) {
                showMessage('发送卡密失败：' + error.message, 'error');
            }
        }

        function showSection(sectionName) {
            document.querySelectorAll('.admin-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.admin-nav button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(`section-${sectionName}`).classList.add('active');
            event.target.classList.add('active');
            
            if (sectionName === 'orders') {
                loadOrders();
            } else if (sectionName === 'prices') {
                loadPrices();
            } else if (sectionName === 'account') {
                loadAdminCredentials();
            }
        }

        async function loadAdminCredentials() {
            try {
                const admin = JSON.parse(localStorage.getItem('admin'));
                if (admin) {
                    document.getElementById('new-username').value = admin.username;
                }
            } catch (error) {
                console.error('加载管理员信息失败:', error);
            }
        }

        async function updateAdminCredentials(event) {
            event.preventDefault();
            const newUsername = document.getElementById('new-username').value;
            const newPassword = document.getElementById('new-password').value;
            
            try {
                const response = await fetch(`${API_BASE}/admin/update-admin-credentials`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: newUsername, password: newPassword })
                });
                const data = await response.json();
                
                if (data.success) {
                    showMessage('管理员账号密码更新成功，请重新登录');
                    setTimeout(() => {
                        logout();
                    }, 2000);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('更新失败，请稍后重试', 'error');
            }
        }

        async function loadPrices() {
            try {
                const response = await fetch(`${API_BASE}/admin/prices`);
                const data = await response.json();
                
                const tbody = document.getElementById('prices-table');
                
                if (data.success && data.data.length > 0) {
                    tbody.innerHTML = data.data.map(price => {
                        return `
                        <tr>
                            <td>${price.card_type}</td>
                            <td>¥${price.price.toFixed(2)}</td>
                            <td>${price.days_valid}天</td>
                            <td>${price.description || '-'}</td>
                            <td>${new Date(price.updated_at).toLocaleString()}</td>
                            <td>
                                <button onclick="editPrice('${price.card_type}', ${price.price}, ${price.days_valid}, '${price.description || ''}')" class="btn-primary" style="padding: 5px 10px; font-size: 12px; margin: 2px;">编辑</button>
                            </td>
                        </tr>
                    `}).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><h3>暂无价格配置</h3></td></tr>';
                }
            } catch (error) {
                console.error('加载价格失败:', error);
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><h3>加载失败</h3></td></tr>';
            }
        }

        function editPrice(cardType, currentPrice, currentDays, currentDescription) {
            const newPrice = prompt('请输入新价格（元）:', currentPrice);
            if (newPrice === null) return;
            
            const price = parseFloat(newPrice);
            if (isNaN(price) || price <= 0) {
                showMessage('请输入有效的价格', 'error');
                return;
            }
            
            const newDays = prompt('请输入有效期（天）:', currentDays);
            if (newDays === null) return;
            
            const days = parseInt(newDays);
            if (isNaN(days) || days <= 0) {
                showMessage('请输入有效的天数', 'error');
                return;
            }
            
            const newDescription = prompt('请输入描述:', currentDescription);
            if (newDescription === null) return;
            
            updatePrice(cardType, price, days, newDescription);
        }

        async function updatePrice(cardType, price, daysValid, description) {
            try {
                const response = await fetch(`${API_BASE}/admin/prices/${cardType}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        price: price,
                        days_valid: daysValid,
                        description: description
                    })
                });
                const data = await response.json();
                
                if (data.success) {
                    showMessage('价格更新成功', 'success');
                    loadPrices();
                } else {
                    showMessage(data.message || '更新价格失败', 'error');
                }
            } catch (error) {
                showMessage('更新价格失败：' + error.message, 'error');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            await login(username, password);
        });

        window.onload = function() {
            const admin = localStorage.getItem('admin');
            if (admin) {
                const adminData = JSON.parse(admin);
                document.getElementById('username-display').textContent = adminData.username;
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadOrders();
            }
        };
    </script>
</body>
</html>
